name: Nuget Calabonga.CommandexCommand.Template (NET10)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Calabonga.CommandexCommand.Template.sln

      - name: Build & pack
        run: dotnet pack src/Calabonga.CommandexCommand.Template.sln --configuration Release --no-restore --output ${{ github.workspace }}\artifacts

      - name: Publish NuGet package
        run: dotnet nuget push ${{ github.workspace }}\artifacts\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
